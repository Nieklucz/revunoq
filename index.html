<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Strona wyłączona</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif;text-align:center;padding:24px}
    main{max-width:600px}
    h1{font-size:clamp(32px,6vw,54px);margin:0 0 14px}
    p{margin:0;color:#a9a9a9;font-size:17px}
  </style>
</head>
<body>
  <main>
    <h1>Strona wyłączona</h1>
    <p>Ta strona jest obecnie niedostępna.</p>
  </main>
</body>
</html>
